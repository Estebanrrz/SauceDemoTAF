# Settings of the performance tests: load profiles, scenarios and test data. No numbers live in the code.
#
#   ./perf/run.sh smoke            run one profile (smoke, normal, stress, spike, soak)
#   ./perf/run.sh --list           show the profiles below
#   ./perf/run.sh smoke --config my.toml    use another file with the same layout
#
# perf/run.sh starts its own copy of the app and the payment mock on free ports, with a new temporary
# database, so a run never touches app/shop.db and never disturbs an app you have open yourself.

[run]
stop_timeout = 15        # s a user gets to finish the flow it is in when the load goes down or the run ends
app_start_timeout = 30   # s to wait for GET /api/v1/health to answer 200 before giving up
progress_every = 10      # s between the progress lines printed during the run
request_timeout = 10     # s without an answer after which a request counts as an error
token_ttl_seconds = 300  # token lifetime given to the app (TOKEN_TTL_SECONDS); 300 is the app's default
token_renew_margin = 30  # a user logs in again this many s before its token expires (soak runs longer than a token)

[accounts]
# Users that can log in (Data/users.json; locked_out_user cannot). Each virtual user takes the next one.
usernames = ["standard_user", "problem_user", "performance_glitch_user"]
password = "secret_sauce"

[checkout]
first_name = "Perf"
last_name = "Runner"
postal_code = "12345"
card = "SauceCard #31337"            # the payment mock approves it (201)
declined_card = "SauceCard #DECLINED"  # the payment mock declines it: the shop answers 402, which is expected
declined_card_every = 10             # every 10th order of the run pays with the declined card (1st, 11th, 21st...): 10%
tax_rate = 0.08                      # to check the total of every order: subtotal + round(subtotal * tax_rate) cents

# ---- Scenarios --------------------------------------------------------------------------------------
# weight: share of the virtual users that run it (5:3:2 -> 50% / 30% / 20%).
# wait:   [min, max] s a user pauses after each flow (think time).
# items:  [min, max] different products put into the cart in one flow.

[scenarios.browse]   # catalogue, sorted in a random way, then a few products opened
weight = 5
wait = [1, 3]
products_opened = [1, 3]

[scenarios.cart]     # catalogue, add products, read the cart, remove one, empty the cart
weight = 3
wait = [1, 3]
items = [2, 4]

[scenarios.buy]      # catalogue, add products, pay the order (payment mock), read the order back
weight = 2
wait = [1, 3]
items = [1, 3]

# ---- Profiles ---------------------------------------------------------------------------------------
# A profile is a list of stages run one after the other. In each stage the number of virtual users moves
# to `users`, `spawn_rate` users per second, and the stage lasts `duration` seconds in total (the ramp is
# part of it). Every user logs in once and logs out when it stops, so a ramp up is also a burst of logins.
#
# Thresholds: the run fails (exit code 1) when a measured value is above its limit, and says which one.
#   total          limits on all requests together; error_pct is required, so real errors always count
#   each_endpoint  limits on every endpoint that had requests
#   endpoints."POST /orders" = { ... }   limits for one endpoint, on top of each_endpoint; an endpoint listed
#                  here that got no requests at all fails too (nothing was measured)
# Limits: p50_ms, p95_ms, p99_ms (response time percentiles, ms) and error_pct (% of requests with an error).
# Endpoint names are those of the results table (perf/settings.py ENDPOINTS). Override one for a single run
# with --threshold, e.g. ./perf/run.sh smoke --threshold p95_ms=1
#
# Headroom: timings on a shared machine vary a lot between runs, so every limit has room on purpose. All the
# limits were measured on the 4-core development machine: smoke x11, normal x4, soak x2, stress x7 and spike x5
# (stress and spike include 5 runs made while the host took CPU away: 10 to 41% "steal" in vmstat; normal and
# soak also use the 15-user stage of all 7 stress runs).
# The same profile could be many times slower than the run before (stress total p95: 18.5 to 591.5 ms), and the
# slow minutes came at random load levels, so it is the machine, not the app. 0 errors in every run. The rule
# for every limit of every profile:
#   limit = 2 x the worst value measured at that load, rounded up to the next 50 ms (next 500 ms above 1 s)
#   error_pct = 0: no run had a single error and the slowest request of all (3.6 s, a login in stress) is far
#               from request_timeout, so any error is a real finding (wrong answer or no answer in 10 s).
# smoke: one limit for every endpoint (each_endpoint), because with ~20 orders and 3 logins per run an endpoint's
# p95 is just its slowest request. normal, soak, stress and spike: every endpoint has its own limits (2x its own
# worst), because on a slow machine the endpoints are too far apart for one shared limit.
# Recalibrate the limits on the machine that runs them.

[profiles.smoke]
description = "Is it working? 3 users (one per scenario) for 45 s"
stages = [
    { duration = 45, users = 3, spawn_rate = 3 },
]
# Calibrated with 11 runs: 9 with a results file (total p95 7.3-13.0 ms, p99 22.0-40.7 ms) and 2 earlier runs
# on a busier machine, known only from Locust's own table, which rounds above 100 ms to 2 digits (total p95 17
# and 60 ms, p99 66 and 130 ms). With ~20 orders and 3 logins per run, an endpoint's p95 is its slowest request.
[profiles.smoke.thresholds]
# worst total: p95 60 ms, p99 130 ms (busy run, Locust's numbers) -> 2x = 120 / 260
total = { p95_ms = 150, p99_ms = 300, error_pct = 0 }
# worst endpoint: POST /orders p95 and p99 230 ms (busy run, Locust's rounding of a 226 ms order) -> 2x = 460;
# login's worst, 160 ms (same run), gives 320, so it needs no limits of its own
each_endpoint = { p95_ms = 500, p99_ms = 500, error_pct = 0 }
# not a timing limit: this endpoint must get requests in every run (the 1st order pays with the declined card)
endpoints."POST /orders (declined card)" = { error_pct = 0 }

[profiles.normal]
description = "Expected everyday load: ramp to 15 users, hold, 2 min"
stages = [
    { duration = 120, users = 15, spawn_rate = 1 },
]
# Calibrated for 15 users, the load of normal and soak, with every run made at that load: normal x4, soak x2
# and the first stage (0-45 s, 15 users) of all 7 stress runs, 13 windows. 0 errors in all of them. All worst
# values except logout's come from the 15-user stage of the stress runs made while the host took CPU away
# (140430, 140952, 141604), so a normal or soak run on a machine that slow should still pass. No normal or soak
# run was made in that state; they stayed much lower (normal x4:
# total p95 9.1 to 17.8 ms, p99 18.9 to 49.0 ms; soak x2: p95 22.4 / 11.2 ms, p99 45.0 / 26.1 ms). As in stress
# and spike, every endpoint has its own limits: under a slow machine reads stayed near 0.1 s, POST /orders went
# to 0.23 s and login to 0.6 s, so one shared limit would hide a slow read.
[profiles.normal.thresholds]
# worst total at 15 users: p95 152.7 ms (stress 140952, 0-45 s), p99 325.5 ms (stress 141604, 0-45 s)
# -> 2x = 305.4 / 651
total = { p95_ms = 350, p99_ms = 700, error_pct = 0 }
each_endpoint = { error_pct = 0 }
# each endpoint: 2x its own worst p95 / p99 at 15 users (window in brackets)
endpoints."POST /auth/login" = { p95_ms = 1500, p99_ms = 1500 }               #  609.8 / 609.8 (stress 141604, 0-45 s)
endpoints."GET /products" = { p95_ms = 200, p99_ms = 350 }                    #   99.7 / 152.0 (stress 140952, 0-45 s)
endpoints."GET /products/{id}" = { p95_ms = 250, p99_ms = 350 }               #  103.3 / 163.0 (stress 140952, 0-45 s)
endpoints."POST /cart/items" = { p95_ms = 350, p99_ms = 450 }                 #  170.8 / 222.8 (stress 140952, 0-45 s)
endpoints."GET /cart/items" = { p95_ms = 200, p99_ms = 350 }                  #   97.5 / 163.1 (stress 140952, 0-45 s)
endpoints."DELETE /cart/items/{id}" = { p95_ms = 350, p99_ms = 700 }          #  162.2 (140952) / 325.5 (141604), 0-45 s
endpoints."DELETE /cart/items" = { p95_ms = 300, p99_ms = 350 }               #  130.4 / 167.9 (stress 140952, 0-45 s)
endpoints."POST /orders" = { p95_ms = 500, p99_ms = 550 }                     #  231.2 / 269.2 (stress 140952, 0-45 s)
endpoints."POST /orders (declined card)" = { p95_ms = 400, p99_ms = 400 }     #  181.1 / 181.1 (stress 140430, 0-45 s)
endpoints."GET /orders/{id}" = { p95_ms = 200, p99_ms = 300 }                 #   90.9 / 140.3 (stress 140952, 0-45 s)
# logout: the 15 users all stop at the end and log out at the same moment
endpoints."POST /auth/logout" = { p95_ms = 250, p99_ms = 250 }                #  108.1 / 108.1 (normal 140021)

[profiles.stress]
description = "Where does it bend? Steps of 15, 30, 50 and 80 users, 45 s each, 3 min"
stages = [
    { duration = 45, users = 15, spawn_rate = 5 },
    { duration = 45, users = 30, spawn_rate = 5 },
    { duration = 45, users = 50, spawn_rate = 5 },
    { duration = 45, users = 80, spawn_rate = 5 },
]
# Calibrated with all 7 stress runs of the development machine: 4 with the full CPU (16,667 to 18,007 requests,
# total p95 18.5 to 140.9 ms, up to 179 req/s at 80 users) and 3 while the host took 36 to 41% of the CPU
# ("steal" in vmstat; 11,648 to 12,724 requests, total p95 528.0 to 591.5 ms, at most 95 req/s at 80 users).
# 0 errors in all 7. The worst values all come from the 3 runs without the full CPU, so these limits pass even
# then: they catch any error, and timings at least twice as bad as that (2x the rule below).
# The endpoints differ a lot under that load (reads ~0.5 s, writes ~0.85 s, login/logout seconds), so every
# endpoint has its own limits: one shared limit, set by the slowest, would hide a slow read.
[profiles.stress.thresholds]
# worst total: p95 591.5 ms (run 140952), p99 1221.0 ms (run 140952) -> 2x = 1183 / 2442
total = { p95_ms = 1500, p99_ms = 2500, error_pct = 0 }
each_endpoint = { error_pct = 0 }
# each endpoint: 2x its own worst p95 / p99 of the 7 runs (run in brackets)
endpoints."POST /auth/login" = { p95_ms = 3500, p99_ms = 7500 }               # 1664.0 (140430) / 3555.2 (140430)
endpoints."GET /products" = { p95_ms = 1000, p99_ms = 2000 }                  #  484.9 (140952) /  858.1 (140952)
endpoints."GET /products/{id}" = { p95_ms = 950, p99_ms = 1500 }              #  473.1 (140952) /  641.1 (141604)
endpoints."POST /cart/items" = { p95_ms = 2000, p99_ms = 3500 }               #  780.6 (140952) / 1601.4 (140430)
endpoints."GET /cart/items" = { p95_ms = 950, p99_ms = 1500 }                 #  466.9 (140952) /  616.4 (140952)
endpoints."DELETE /cart/items/{id}" = { p95_ms = 2000, p99_ms = 3500 }        #  849.0 (140952) / 1634.7 (140952)
endpoints."DELETE /cart/items" = { p95_ms = 2000, p99_ms = 3500 }             #  802.5 (140952) / 1517.0 (140952)
endpoints."POST /orders" = { p95_ms = 2000, p99_ms = 3500 }                   #  831.6 (140430) / 1571.3 (140430)
endpoints."POST /orders (declined card)" = { p95_ms = 1500, p99_ms = 1500 }   #  515.1 (140952) /  715.2 (141604)
endpoints."GET /orders/{id}" = { p95_ms = 950, p99_ms = 1500 }                #  464.2 (140430) /  627.0 (141604)
# logout: the 80 users all stop at the end and log out at the same moment
endpoints."POST /auth/logout" = { p95_ms = 5500, p99_ms = 5500 }              # 2565.3 (140430) / 2725.8 (140430)

[profiles.spike]
description = "Sudden jump: 10 users, then 80 almost at once for 30 s, then back to 10, 2 min"
stages = [
    { duration = 45, users = 10, spawn_rate = 5 },
    { duration = 30, users = 80, spawn_rate = 40 },
    { duration = 45, users = 10, spawn_rate = 40 },
]
# Calibrated with all 5 spike runs of the development machine: 3 with the full CPU (7,396 to 7,543 requests,
# total p95 101.9 to 126.7 ms) and 2 while the host was taking CPU away (6,296 and 6,489 requests, total p95
# 313.6 and 386.3 ms; 10% steal on average measured during the first). 0 errors in all 5. The 70 new users log
# in at once (about 40 ms of CPU each), so login waits longest. As in stress, every endpoint has its own limits.
[profiles.spike.thresholds]
# worst total: p95 386.3 ms (run 140224), p99 931.7 ms (run 140224) -> 2x = 772.6 / 1863.4
total = { p95_ms = 800, p99_ms = 2000, error_pct = 0 }
each_endpoint = { error_pct = 0 }
# each endpoint: 2x its own worst p95 / p99 of the 5 runs (run in brackets)
endpoints."POST /auth/login" = { p95_ms = 3000, p99_ms = 5000 }               # 1480.7 (141300) / 2410.2 (141300)
endpoints."GET /products" = { p95_ms = 700, p99_ms = 1000 }                   #  338.5 (140224) /  496.1 (140224)
endpoints."GET /products/{id}" = { p95_ms = 700, p99_ms = 950 }               #  326.3 (140224) /  468.4 (140224)
endpoints."POST /cart/items" = { p95_ms = 850, p99_ms = 2000 }                #  406.2 (140224) /  982.0 (140224)
endpoints."GET /cart/items" = { p95_ms = 550, p99_ms = 750 }                  #  266.8 (140224) /  368.5 (140224)
endpoints."DELETE /cart/items/{id}" = { p95_ms = 750, p99_ms = 2000 }         #  369.2 (140224) /  997.5 (140224)
endpoints."DELETE /cart/items" = { p95_ms = 850, p99_ms = 3000 }              #  402.9 (140224) / 1457.5 (140224)
endpoints."POST /orders" = { p95_ms = 950, p99_ms = 2500 }                    #  462.1 (140224) / 1009.4 (140224)
endpoints."POST /orders (declined card)" = { p95_ms = 950, p99_ms = 1500 }    #  468.2 (140224) /  666.8 (140224)
endpoints."GET /orders/{id}" = { p95_ms = 500, p99_ms = 2000 }                #  247.8 (140224) /  754.2 (140224)
endpoints."POST /auth/logout" = { p95_ms = 2000, p99_ms = 2500 }              #  869.6 (140224) / 1126.2 (140224)

[profiles.soak]
description = "Steady load for 8 min: longer than a token lives, so every user logs in again at least once"
stages = [
    { duration = 480, users = 15, spawn_rate = 1 },
]
# Same 15 users as normal, so the same limits and the same reasons (see normal). The soak runs are part of that
# calibration: soak x2 (8 min each, 16,408 and 16,728 requests, 0 errors, every user logged in again once, no
# slowdown over time: p95 per minute 10.8 to 37.6 ms in the first run).
[profiles.soak.thresholds]
# worst total at 15 users: p95 152.7 ms (stress 140952, 0-45 s), p99 325.5 ms (stress 141604, 0-45 s)
# -> 2x = 305.4 / 651
total = { p95_ms = 350, p99_ms = 700, error_pct = 0 }
each_endpoint = { error_pct = 0 }
# each endpoint: 2x its own worst p95 / p99 at 15 users (window in brackets)
endpoints."POST /auth/login" = { p95_ms = 1500, p99_ms = 1500 }               #  609.8 / 609.8 (stress 141604, 0-45 s)
endpoints."GET /products" = { p95_ms = 200, p99_ms = 350 }                    #   99.7 / 152.0 (stress 140952, 0-45 s)
endpoints."GET /products/{id}" = { p95_ms = 250, p99_ms = 350 }               #  103.3 / 163.0 (stress 140952, 0-45 s)
endpoints."POST /cart/items" = { p95_ms = 350, p99_ms = 450 }                 #  170.8 / 222.8 (stress 140952, 0-45 s)
endpoints."GET /cart/items" = { p95_ms = 200, p99_ms = 350 }                  #   97.5 / 163.1 (stress 140952, 0-45 s)
endpoints."DELETE /cart/items/{id}" = { p95_ms = 350, p99_ms = 700 }          #  162.2 (140952) / 325.5 (141604), 0-45 s
endpoints."DELETE /cart/items" = { p95_ms = 300, p99_ms = 350 }               #  130.4 / 167.9 (stress 140952, 0-45 s)
endpoints."POST /orders" = { p95_ms = 500, p99_ms = 550 }                     #  231.2 / 269.2 (stress 140952, 0-45 s)
endpoints."POST /orders (declined card)" = { p95_ms = 400, p99_ms = 400 }     #  181.1 / 181.1 (stress 140430, 0-45 s)
endpoints."GET /orders/{id}" = { p95_ms = 200, p99_ms = 300 }                 #   90.9 / 140.3 (stress 140952, 0-45 s)
# logout: the 15 users all stop at the end and log out at the same moment
endpoints."POST /auth/logout" = { p95_ms = 250, p99_ms = 250 }                #  108.1 / 108.1 (normal 140021)
