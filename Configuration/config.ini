[settings]
; Base URL of the application under test (override with the SAUCEDEMO_URL environment variable)
baseUrl=https://www.saucedemo.com/
; Run Chrome without a window (override with HEADLESS=1)
headless=false
; Extra attempts for a failed scenario. 0 disables retries (override with RETRIES=n)
retries=1
; Seconds
explicitWait=10
pageLoadTimeout=30

[paths]
; Relative to the project root
data=Data
artifacts=artifacts
