[settings]
; App under test: the local copy (change it with SAUCEDEMO_URL, e.g. to try the real site)
baseUrl=http://127.0.0.1:5055/
; Run the browser without a window (HEADLESS=0 to watch the tests)
headless=true
; playwright or selenium (the pytest option --engine overrides it)
engine=playwright
; Playwright only: use an installed browser such as chrome instead of its own Chromium
browserChannel=
; Seconds
explicitWait=10
pageLoadTimeout=30

[paths]
; Relative to the project root
data=Data
