{% extends "base.html" %}
{% block content %}
<span class="title" role="heading" aria-level="1" data-test="title">Your Cart</span>
<div class="cart_contents_container">
  <div class="cart_list" data-test="cart-list">
    <div class="cart_quantity_label" data-test="cart-quantity-label">QTY</div>
    <div class="cart_desc_label" data-test="cart-desc-label">Description</div>
    {% for p in items %}
    <div class="cart_item" data-test="inventory-item" data-name="{{ p.name }}">
      <div class="cart_quantity" data-test="item-quantity">1</div>
      <div class="cart_item_label">
        <a href="#"><div class="inventory_item_name" data-test="inventory-item-name">{{ p.name }}</div></a>
        <div class="inventory_item_desc" data-test="inventory-item-desc">{{ p.description }}</div>
        <div class="item_pricebar">
          <div class="inventory_item_price" data-test="inventory-item-price">${{ money(p.price) }}</div>
          <form method="post" action="{{ url_for('toggle_cart', product_id=p.id) }}" style="display:inline;">
            <input type="hidden" name="back" value="{{ request.path }}">
            <button class="btn btn_secondary btn_small cart_button" id="remove-{{ p.slug }}"
                    aria-label="Remove {{ p.name }} from cart"
                    data-test="remove-{{ p.slug }}">Remove</button>
          </form>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="cart_footer" style="margin:20px;">
    <form method="get" action="{{ url_for('inventory') }}" style="display:inline;">
      <button class="btn btn_secondary back" id="continue-shopping" data-test="continue-shopping">Continue Shopping</button>
    </form>
    <form method="get" action="{{ url_for('checkout_step_one') }}" style="display:inline;">
      <button class="btn btn_action checkout_button" id="checkout" data-test="checkout">Checkout</button>
    </form>
  </div>
</div>
{% endblock %}
