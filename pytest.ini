[pytest]
; UI tests (browser) and API tests (no browser). "pytest tests" or "pytest tests_api" runs only one of them
testpaths = tests tests_api
; The HTML report file is chosen in conftest.py: one per engine and device (or pass --html=...)
addopts = --self-contained-html
; Show every step live in the console, no flags needed
log_cli = true
log_cli_level = INFO
markers =
    mobile: layout checks for phones and tablets (tests/test_mobile.py)
    all_devices: checks every supported device by itself; with several --device they run only once
    api: API tests in tests_api/ (added by tests_api/conftest.py); no browser, with several --device they run only once
log_cli_format = %(message)s
